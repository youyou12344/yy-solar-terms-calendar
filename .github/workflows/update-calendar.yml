name: Update Solar Terms Calendar

on:
  # 每月 1 号 02:00 (UTC) 自动运行一次，保证覆盖当年 + 下一年
  schedule:
    - cron: "0 2 1 * *"
  # 允许在 GitHub 页面手动触发
  workflow_dispatch:

# 允许将生成的文件提交回仓库（触发 Pages 重新部署）
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: pip install lunar_python

      - name: Generate .ics
        run: python gen_jieqi.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # 若内容无变化（例如同月重复触发）则不提交
          if ! git diff --cached --quiet; then
            git commit -m "chore: update solar terms calendar"
            git push
            echo "已更新并推送"
          else
            echo "无变化，跳过提交"
          fi
